<!doctype html>
<!--
  Plantilla de la que se rinde public/og.png (1200 × 630).

  Importa src/styles/fer.css en vez de repetir los colores, para que el marcador
  y la tinta salgan de los tokens y la imagen no se desincronice del sitio.

  Para regenerarla, con cualquier navegador headless. Ejemplo:
    chromium --headless --window-size=1200,630 \
      --screenshot=site/public/og.png site/scripts/og.html

  Requiere red la primera vez: las tipografías vienen de Google Fonts, igual que en
  el layout. Revisar que el texto no quedó en la tipografía de reserva antes de
  dar la imagen por buena.
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="../src/styles/fer.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }

      .og {
        width: 1200px;
        height: 630px;
        display: flex;
        flex-direction: column;
        background: linear-gradient(180deg, var(--cian-papel) 0%, var(--papel) 55%);
        overflow: hidden;
      }

      .og__cuerpo {
        flex: 1;
        padding: 68px 80px 0;
      }

      .og__rotulo {
        font-family: var(--mono);
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--cian-texto);
        margin: 0 0 32px;
      }

      .og__rotulo::before {
        content: "";
        display: block;
        width: 56px;
        height: 4px;
        border-radius: 999px;
        background: var(--cian);
        margin-bottom: 20px;
      }

      .og__titulo {
        font-family: var(--display);
        font-weight: 700;
        font-size: 82px;
        line-height: 0.98;
        letter-spacing: -0.03em;
        color: var(--navy);
        margin: 0;
      }

      .og__titulo span {
        color: var(--cian);
      }

      .og__tarjeta {
        margin: 40px 0 0;
        background: var(--papel);
        border: 1px solid #e0e9f3;
        border-radius: 20px;
        box-shadow: var(--sombra-heroe);
        padding: 26px 30px;
      }

      .og__campo {
        font-family: var(--mono);
        font-size: 14px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--tinta-fantasma);
        margin: 0 0 14px;
      }

      .og__cadena {
        font-family: var(--mono);
        font-size: 19px;
        color: var(--tinta);
        white-space: nowrap;
        margin: 0;
      }

      /* El trazo se anima al entrar y el navegador headless captura antes de tiempo. */
      .og .marca {
        animation: none;
      }

      .og__pie {
        background: var(--navy);
        padding: 26px 80px;
      }

      .og__claim {
        font-family: var(--sans);
        font-size: 21px;
        line-height: 1.45;
        color: rgba(255, 255, 255, 0.78);
        margin: 0;
        max-width: 62ch;
      }

      .og__claim strong {
        font-weight: 600;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="og">
      <div class="og__cuerpo">
        <p class="og__rotulo">Convención abierta · Panamá · versión 1.1.1</p>
        <h1 class="og__titulo">Factura Electrónica<br /><span>Retail</span></h1>
        <div class="og__tarjeta">
          <p class="og__campo">dInfEmFE · cabecera del documento (B29)</p>
          <p class="og__cadena">Gracias por su compra. <span class="marca">#FER1# oc=4500000001 | ref=TIENDA RETAIL X #FER1#</span></p>
        </div>
      </div>
      <div class="og__pie">
        <p class="og__claim">
          Una sola regla de lectura para la <strong>Orden de Compra</strong> y el
          <strong>Código de Barras</strong>, independiente del PAC del emisor.
        </p>
      </div>
    </div>
  </body>
</html>
